<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="700" fill="#0f1923" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Cloud Resume Challenge — AWS Architecture</text>

  <!-- ── LANE LABELS ── -->
  <text x="18" y="115" fill="#8899aa" font-size="11" transform="rotate(-90,18,115)">USER</text>
  <text x="18" y="215" fill="#8899aa" font-size="11" transform="rotate(-90,18,215)">DNS</text>
  <text x="18" y="315" fill="#8899aa" font-size="11" transform="rotate(-90,18,315)">CDN</text>
  <text x="18" y="415" fill="#8899aa" font-size="11" transform="rotate(-90,18,415)">STORAGE</text>
  <text x="18" y="515" fill="#8899aa" font-size="11" transform="rotate(-90,18,515)">BACKEND</text>
  <text x="18" y="615" fill="#8899aa" font-size="11" transform="rotate(-90,18,615)">DATABASE</text>

  <!-- ── HORIZONTAL DIVIDERS ── -->
  <line x1="40" y1="140" x2="860" y2="140" stroke="#1e2d3d" stroke-width="1"/>
  <line x1="40" y1="240" x2="860" y2="240" stroke="#1e2d3d" stroke-width="1"/>
  <line x1="40" y1="340" x2="860" y2="340" stroke="#1e2d3d" stroke-width="1"/>
  <line x1="40" y1="440" x2="860" y2="440" stroke="#1e2d3d" stroke-width="1"/>
  <line x1="40" y1="540" x2="860" y2="540" stroke="#1e2d3d" stroke-width="1"/>

  <!-- ══════════════════════════════════════════
       NODE DEFINITIONS
       Each node: rounded rect + icon circle + label
  ══════════════════════════════════════════ -->

  <!-- 1. User / Browser  (x=390, y=75) -->
  <g id="user">
    <rect x="340" y="60" width="140" height="60" rx="10" fill="#1a2a3a" stroke="#4a9eff" stroke-width="1.5"/>
    <circle cx="380" cy="90" r="18" fill="#4a9eff" opacity="0.2"/>
    <text x="380" y="95" text-anchor="middle" font-size="20">🌐</text>
    <text x="430" y="87" fill="#ffffff" font-size="13" font-weight="bold">User</text>
    <text x="430" y="103" fill="#8899aa" font-size="10">(Browser)</text>
  </g>

  <!-- 2. GoDaddy Domain  (x=620, y=155) -->
  <g id="godaddy">
    <rect x="580" y="155" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#f0a500" stroke-width="1.5"/>
    <circle cx="618" cy="185" r="18" fill="#f0a500" opacity="0.2"/>
    <text x="618" y="191" text-anchor="middle" font-size="18">🌍</text>
    <text x="660" y="182" fill="#ffffff" font-size="13" font-weight="bold">GoDaddy</text>
    <text x="660" y="198" fill="#8899aa" font-size="10">betterway.cloud</text>
  </g>

  <!-- 3. Route 53  (x=340, y=155) -->
  <g id="route53">
    <rect x="290" y="155" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="328" cy="185" r="18" fill="#8b5cf6" opacity="0.2"/>
    <text x="328" y="191" text-anchor="middle" font-size="18">🔀</text>
    <text x="368" y="182" fill="#ffffff" font-size="13" font-weight="bold">Route 53</text>
    <text x="368" y="198" fill="#8899aa" font-size="10">DNS Routing</text>
  </g>

  <!-- 4. ACM SSL  (x=620, y=255) -->
  <g id="acm">
    <rect x="580" y="255" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="618" cy="285" r="18" fill="#10b981" opacity="0.2"/>
    <text x="618" y="291" text-anchor="middle" font-size="18">🔒</text>
    <text x="658" y="282" fill="#ffffff" font-size="13" font-weight="bold">ACM</text>
    <text x="658" y="298" fill="#8899aa" font-size="10">SSL Certificate</text>
  </g>

  <!-- 5. CloudFront  (x=340, y=255) -->
  <g id="cloudfront">
    <rect x="290" y="255" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="328" cy="285" r="18" fill="#f97316" opacity="0.2"/>
    <text x="328" y="291" text-anchor="middle" font-size="18">⚡</text>
    <text x="368" y="279" fill="#ffffff" font-size="13" font-weight="bold">CloudFront</text>
    <text x="368" y="295" fill="#8899aa" font-size="10">CDN + HTTPS + OAC</text>
  </g>

  <!-- 6. S3 Bucket  (x=340, y=355) -->
  <g id="s3">
    <rect x="290" y="355" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="328" cy="385" r="18" fill="#22c55e" opacity="0.2"/>
    <text x="328" y="391" text-anchor="middle" font-size="18">🪣</text>
    <text x="368" y="379" fill="#ffffff" font-size="13" font-weight="bold">S3 Bucket</text>
    <text x="368" y="395" fill="#8899aa" font-size="10">Private + OAC</text>
  </g>

  <!-- 7. API Gateway  (x=340, y=455) -->
  <g id="apigw">
    <rect x="290" y="455" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="328" cy="485" r="18" fill="#ec4899" opacity="0.2"/>
    <text x="328" y="491" text-anchor="middle" font-size="18">🔌</text>
    <text x="368" y="479" fill="#ffffff" font-size="13" font-weight="bold">API Gateway</text>
    <text x="368" y="495" fill="#8899aa" font-size="10">REST API + CORS</text>
  </g>

  <!-- 8. Lambda  (x=580, y=455) -->
  <g id="lambda">
    <rect x="540" y="455" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="578" cy="485" r="18" fill="#f59e0b" opacity="0.2"/>
    <text x="578" y="491" text-anchor="middle" font-size="18">λ</text>
    <text x="618" y="479" fill="#ffffff" font-size="13" font-weight="bold">Lambda</text>
    <text x="618" y="495" fill="#8899aa" font-size="10">Visitor Counter</text>
  </g>

  <!-- 9. DynamoDB  (x=580, y="555") -->
  <g id="dynamo">
    <rect x="540" y="555" width="160" height="60" rx="10" fill="#1a2a3a" stroke="#4a9eff" stroke-width="1.5"/>
    <circle cx="578" cy="585" r="18" fill="#4a9eff" opacity="0.2"/>
    <text x="578" y="591" text-anchor="middle" font-size="18">🗄️</text>
    <text x="618" y="579" fill="#ffffff" font-size="13" font-weight="bold">DynamoDB</text>
    <text x="618" y="595" fill="#8899aa" font-size="10">Visitor Counter Table</text>
  </g>

  <!-- ══════════════════════════════════════════
       ARROWS
  ══════════════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0a500"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-pink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ec4899"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- User → Route 53 -->
  <line x1="410" y1="120" x2="410" y2="153" stroke="#4a9eff" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- GoDaddy → Route 53 (nameserver delegation) -->
  <line x1="580" y1="185" x2="452" y2="185" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="510" y="178" fill="#f0a500" font-size="9">NS delegation</text>

  <!-- Route 53 → CloudFront -->
  <line x1="370" y1="215" x2="370" y2="253" stroke="#4a9eff" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ACM → CloudFront (SSL attach) -->
  <line x1="580" y1="285" x2="452" y2="285" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="468" y="278" fill="#10b981" font-size="9">SSL cert</text>

  <!-- CloudFront → S3 -->
  <line x1="370" y1="315" x2="370" y2="353" stroke="#4a9eff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="375" y="338" fill="#22c55e" font-size="9">OAC</text>

  <!-- S3 → API Gateway (JS fetch) -->
  <line x1="370" y1="415" x2="370" y2="453" stroke="#ec4899" stroke-width="1.8" marker-end="url(#arr-pink)"/>
  <text x="375" y="438" fill="#ec4899" font-size="9">JS fetch()</text>

  <!-- API Gateway → Lambda -->
  <line x1="452" y1="485" x2="538" y2="485" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-yellow)"/>

  <!-- Lambda → DynamoDB -->
  <line x1="620" y1="515" x2="620" y2="553" stroke="#4a9eff" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════ -->
  <rect x="50" y="620" width="340" height="55" rx="8" fill="#111d2b" stroke="#1e2d3d" stroke-width="1"/>
  <text x="65" y="638" fill="#8899aa" font-size="10" font-weight="bold">LEGEND</text>
  <line x1="65" y1="650" x2="95" y2="650" stroke="#4a9eff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="100" y="654" fill="#ccddee" font-size="10">Request / Data flow</text>
  <line x1="200" y1="650" x2="230" y2="650" stroke="#f0a500" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
  <text x="235" y="654" fill="#ccddee" font-size="10">Config / Integration</text>
  <text x="65" y="668" fill="#8899aa" font-size="9">All S3 traffic routed exclusively through CloudFront (OAC — no public access)</text>

</svg>
